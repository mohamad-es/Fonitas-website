<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Foonitas</title>
  <desc id="desc">Foonitas logo with an orange orbital O and the tagline your application promotion and publishing partner.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a3d"/><stop offset=".5" stop-color="#ff6a1f"/><stop offset="1" stop-color="#ff3d0a"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" fill="#070707"/>
  <g fill="#f5f4f1" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="500" letter-spacing="8">
    <text x="92" y="205">F</text><text x="488" y="205">NIT</text><text x="1000" y="205">S</text>
  </g>
  <g transform="translate(365 62)" fill="none" stroke="url(#orange)" stroke-width="7" filter="url(#glow)">
    <path d="M150 0 A150 150 0 1 0 150 300 A150 150 0 0 0 245 34"/>
  </g>
  <circle cx="605" cy="97" r="23" fill="url(#orange)" filter="url(#glow)"/>
  <g fill="#f5f4f1" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" letter-spacing="9">
    <text x="166" y="294">your application promotion and publishing partner</text>
  </g>
  <circle cx="935" cy="191" r="12" fill="#ff5a1f"/>
</svg>
