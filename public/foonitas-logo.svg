<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1277 282" width="1277" height="282" role="img" aria-labelledby="title desc">
  <title id="title">Foonitas</title>
  <desc id="desc">Foonitas logo with orange orbital O and the tagline your application promotion and publishing partner.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb24a"/>
      <stop offset="0.5" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#ff3b08"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1277" height="282" fill="#050505"/>
  <g fill="#f5f4f1" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="500" letter-spacing="5">
    <text x="20" y="157">F</text>
    <text x="512" y="157">NIT</text>
    <text x="1100" y="157">S</text>
  </g>
  <g fill="none" stroke="url(#orange)" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
    <path d="M424 42 A105 105 0 1 0 424 252 A105 105 0 0 0 491 66"/>
  </g>
  <circle cx="495" cy="66" r="21" fill="url(#orange)" filter="url(#glow)"/>
  <path d="M790 157 L835 52 L880 157 M808 116 H862" fill="none" stroke="#f5f4f1" stroke-width="16" stroke-linecap="square"/>
  <circle cx="835" cy="157" r="11" fill="#ff5a1f"/>
  <text x="140" y="246" fill="#f5f4f1" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" letter-spacing="7">your application promotion and publishing partner</text>
</svg>
