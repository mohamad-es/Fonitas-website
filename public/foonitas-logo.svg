<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" role="img" aria-labelledby="title desc">
  <title id="title">Foonitas</title>
  <desc id="desc">Foonitas wordmark with an orange orbital O and the tagline your application promotion and publishing partner.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffad45"/>
      <stop offset=".48" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#ff3d0a"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1400" height="300" fill="#070707"/>
  <g fill="#f5f4f1" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="500" letter-spacing="5">
    <text x="95" y="158">F</text>
    <text x="570" y="158">NIT</text>
    <text x="1215" y="158">S</text>
  </g>
  <g transform="translate(430 42)" fill="none" stroke="url(#orange)" stroke-width="7" filter="url(#glow)">
    <path d="M105 0 A105 105 0 1 0 105 210 A105 105 0 0 0 172 24"/>
  </g>
  <circle cx="600" cy="66" r="21" fill="url(#orange)" filter="url(#glow)"/>
  <path d="M805 158 L850 52 L895 158 M825 120 H875" fill="none" stroke="#f5f4f1" stroke-width="16" stroke-linecap="square"/>
  <circle cx="850" cy="158" r="11" fill="#ff5a1f"/>
  <text x="250" y="245" fill="#f5f4f1" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" letter-spacing="7">your application promotion and publishing partner</text>
</svg>
