<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Foonitas</title>
  <desc id="desc">Foonitas wordmark with an orange orbital O and the tagline your application promotion and publishing partner.</desc>

  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffad45"/>
      <stop offset="0.5" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#ff3d0a"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="360" fill="#070707"/>

  <!-- F -->
  <text
    x="90"
    y="190"
    fill="#f5f4f1"
    font-family="Arial, Helvetica Neue, sans-serif"
    font-size="154"
    font-weight="500"
    letter-spacing="2"
  >F</text>

  <!-- Orbital O: same visual height as the wordmark -->
  <g fill="none" stroke="url(#orange)" stroke-width="7" filter="url(#glow)">
    <path d="M400 47 A73 73 0 1 0 400 193 A73 73 0 0 0 451 68"/>
  </g>
  <circle cx="452" cy="69" r="22" fill="url(#orange)" filter="url(#glow)"/>

  <!-- N I T -->
  <text
    x="515"
    y="190"
    fill="#f5f4f1"
    font-family="Arial, Helvetica Neue, sans-serif"
    font-size="154"
    font-weight="500"
    letter-spacing="4"
  >NIT</text>

  <!-- A -->
  <path
    d="M820 190 L870 48 L920 190 M840 132 H900"
    fill="none"
    stroke="#f5f4f1"
    stroke-width="17"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
  <circle cx="870" cy="190" r="12" fill="#ff5a1f"/>

  <!-- S -->
  <text
    x="1005"
    y="190"
    fill="#f5f4f1"
    font-family="Arial, Helvetica Neue, sans-serif"
    font-size="154"
    font-weight="500"
    letter-spacing="2"
  >S</text>

  <!-- Approved tagline -->
  <text
    x="700"
    y="278"
    text-anchor="middle"
    fill="#f5f4f1"
    font-family="Arial, Helvetica Neue, sans-serif"
    font-size="28"
    font-weight="400"
    letter-spacing="7"
  >your application promotion and publishing partner</text>
</svg>
